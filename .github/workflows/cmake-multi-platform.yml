name: Portable CMake builds

on:
  push:
    branches: ["portable"]
  pull_request:
    branches: ["portable"]

jobs:
  build:
    name: ${{ matrix.client.name }} - ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
          - macos-15-intel
        build_type: [Release, Debug]
        client:
          - name: beta
            alphaplace: "OFF"
            suffix: ""
          - name: alphaplace
            alphaplace: "ON"
            suffix: "-alphaplace"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "bin-dir=${{ github.workspace }}/bin" >> "$GITHUB_OUTPUT"
            echo "exe-name=McBetaCpp${{ matrix.client.suffix }}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "bin-dir=${{ github.workspace }}/bin" >> "$GITHUB_OUTPUT"
            echo "exe-name=McBetaCpp${{ matrix.client.suffix }}" >> "$GITHUB_OUTPUT"
          fi

      # Build dependencies for the vendored SDL2 and OpenAL libraries.
      - name: Install Linux dependencies (SDL2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            gnome-desktop-testing \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            glslang-tools \
            libudev-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libsamplerate0-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            liburing-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libwebp-dev \
            libtiff-dev \
            libavif-dev \
            libfluidsynth-dev \
            libdiscid-dev \
            libmodplug-dev \
            libmpg123-dev \
            libopusfile-dev \
            libvorbis-dev \
            libflac-dev \
            libmikmod-dev \
            libtheora-dev \
            libogg-dev \
            libglvnd-dev \
            libthai-dev

      - name: Configure
        shell: bash
        run: |
          # Unix artifacts must not depend on OpenAL in the build tree.
          cmake -S "${{ github.workspace }}" -B "${{ steps.strings.outputs.build-output-dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DB173_TARGET_ALPHAPLACE=${{ matrix.client.alphaplace }} \
            -DB173_OUTPUT_SUFFIX="${{ matrix.client.suffix }}" \
            -DB173_RENDER_VULKAN=${{ runner.os != 'macOS' && 'ON' || 'OFF' }} \
            -DB173_RENDER_D3D12=${{ runner.os == 'Windows' && 'ON' || 'OFF' }} \
            -DLIBTYPE=${{ runner.os == 'Windows' && 'SHARED' || 'STATIC' }}

      - name: Build game and renderer tools
        shell: bash
        run: |
          cmake --build "${{ steps.strings.outputs.build-output-dir }}" --parallel --verbose \
            --target McBetaCpp McBetaCppStress McBetaCppRendererSmoke McBetaCppFrameCompare \
              McBetaCppRendererSemantics McBetaCppLineGeometrySemantics

      # CPU tests need neither a display nor a GPU on hosted runners.
      - name: Test renderer semantics
        shell: bash
        working-directory: ${{ steps.strings.outputs.bin-dir }}
        run: |
          ./McBetaCppRendererSemantics
          ./McBetaCppLineGeometrySemantics

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.client.name }}-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.build_type }}
          path: |
            ${{ steps.strings.outputs.bin-dir }}/${{ steps.strings.outputs.exe-name }}
            ${{ steps.strings.outputs.bin-dir }}/McBetaCppStress*
            ${{ steps.strings.outputs.bin-dir }}/McBetaCppRendererSmoke*
            ${{ steps.strings.outputs.bin-dir }}/McBetaCppFrameCompare*
            ${{ steps.strings.outputs.bin-dir }}/resource/
            ${{ steps.strings.outputs.bin-dir }}/*.dll
            ${{ steps.strings.outputs.bin-dir }}/*.so
            ${{ steps.strings.outputs.bin-dir }}/*.dylib
          if-no-files-found: error
          retention-days: 30
